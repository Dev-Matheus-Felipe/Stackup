name: stackup

services:
  stackupdb:
    container_name: stackupdb
    image: postgres:16

    env_file:
      - ./backend/.env

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 5

    volumes:
      - postgres_data:/var/lib/postgresql/data


  stackupapi:
    container_name: stackupapi

    build: 
      dockerfile: backend.dockerFile
      context: .

    depends_on:
      stackupdb:
        condition: service_healthy

    env_file:
      - ./backend/.env

    develop:
      watch:
        - path: ./backend
          action: rebuild
      
  stackupfront:
    container_name: stackupfront
  
    build: 
      dockerfile: frontend.prod.dockerFile
      context: .

    develop:
      watch: 
        - path: ./frontend
          action: sync
          target: /app
          ignore:
            - node_modules/
            - .next/
            
        - path: ./frontend/package.json
          action: rebuild

        - path: ./frontend/package-lock.json
          action: rebuild

    depends_on:
      - stackupapi

volumes:
  postgres_data:
