services:
  stackupdb:
    container_name: stackupdb
    image: postgres:16

    env_file:
      - ./backend/.env

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 5

    volumes:
      - ./postgres_data:/var/lib/postgresql/data


  stackupapi:
    container_name: stackupapi

    build: 
      dockerfile: backend.dockerFile
      context: .

    depends_on:
      stackupdb:
        condition: service_healthy

    env_file:
      - ./backend/.env
      
  stackupfront:
    container_name: stackupfront
  
    build: 
      dockerfile: frontend.prod.dockerFile
      context: .

    depends_on:
      - stackupapi
