services:
  stackupdb:
    restart: unless-stopped
    networks:
      - backend_network

  stackupapi:
    restart: unless-stopped
    networks:
      - backend_network

  stackupfront:
    restart: unless-stopped
    ports:
      - "10.225.201.165:3000:3000"
    networks:
      - frontend_network
      - backend_network


networks:
  frontend_network:
    driver: bridge

  backend_network:
    driver: bridge
    internal: true
