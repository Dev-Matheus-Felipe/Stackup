services:
  stackupfront:
    image: stackup-stackupfront-dev 

    build:
      dockerfile: frontend.dev.dockerFile
      context: .

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - front_modules:/app/node_modules
      - front_build:/app/.next

  stackupapi:
    ports:
      - "8085:8080"

volumes:
  front_modules:
  front_build:
      