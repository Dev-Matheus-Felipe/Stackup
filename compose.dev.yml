services:
  stackupfront:
    image: stackup-stackupfront-dev 

    build:
      dockerfile: frontend.dev.dockerFile
      context: .

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  stackupapi:
    ports:
      - "8085:8080"

      